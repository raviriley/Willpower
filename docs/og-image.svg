<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f7"/>
      <stop offset="100%" style="stop-color:#e8e8ed"/>
    </linearGradient>

    <!-- Screenshot shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- Button shadow -->
    <filter id="btnShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6345C6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Screenshot with rounded corners and shadow -->
  <!-- Screenshot dimensions: 2024x1558, aspect ratio: 1.299:1 -->
  <g transform="translate(40, 50)" filter="url(#shadow)">
    <clipPath id="screenClip">
      <rect x="0" y="0" width="690" height="531" rx="12" ry="12"/>
    </clipPath>
    <image
      x="0" y="0"
      width="690" height="531"
      preserveAspectRatio="xMidYMid meet"
      clip-path="url(#screenClip)"
      xlink:href="screenshot.png"/>
  </g>

  <!-- Right side content -->
  <g transform="translate(770, 128)">
    <!-- Logo -->
    <g transform="translate(0, 0)">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#6345C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <line x1="8.5" y1="8" x2="8.5" y2="16"/>
        <line x1="15.5" y1="8" x2="15.5" y2="16"/>
        <line x1="8.5" y1="16" x2="12" y2="12"/>
        <line x1="15.5" y1="16" x2="12" y2="12"/>
      </svg>
    </g>


    <!-- Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="600" fill="#1d1d1f">
      <tspan x="0" y="120" font-size="42">Willpower</tspan>
      <tspan x="0" y="168" font-size="32" fill="#6e6e73">macOS Website Blocker</tspan>
      <tspan x="0" y="208" font-size="32" fill="#6e6e73">for Focus &amp; Productivity</tspan>
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 250)" filter="url(#btnShadow)">
      <rect x="0" y="0" width="200" height="56" rx="28" ry="28" fill="#6345C6"/>
      <text x="100" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">Download Now</text>
    </g>
  </g>
</svg>