name: Bug Report
description: Report a bug with Willpower
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue? Ideally, you've reproduced this on the latest version of Willpower.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which version of Willpower are you using? (Check Settings or About to validate you have the latest version)
      placeholder: e.g. 1.0.9
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: "Which version of macOS are you running? (Apple menu > About This Mac)"
      placeholder: e.g. macOS 15.3
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Browser(s) Affected
      description: If this is a blocking issue, which browser(s) are affected?
      multiple: true
      options:
        - Safari
        - Chrome
        - Firefox
        - Arc
        - Brave
        - Edge
        - Other
        - N/A
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or paste relevant log output.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help (e.g. VPN, firewall, custom DNS).
    validations:
      required: false
